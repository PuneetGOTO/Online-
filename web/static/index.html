<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>節點控制台 · 壓測平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 登入層 -->
<div id="login" class="login">
  <form class="login-card" id="login-form">
    <div class="brand-mark">LT</div>
    <h1>節點控制台</h1>
    <p class="muted">此頁可部署伺服器，需存取權杖</p>
    <input id="token" type="password" placeholder="WEB_TOKEN" autocomplete="current-password" required>
    <button type="submit" class="btn primary wide">登入</button>
    <p id="login-error" class="err-text"></p>
  </form>
</div>

<!-- 主介面 -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark small">LT</div>
      <div>
        <h1>節點控制台</h1>
        <p class="sub" id="server-line">載入中…</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="chip" id="chip-online">— 在線</span>
      <span class="chip" id="chip-capacity">容量 —</span>
      <button class="btn ghost small" id="btn-refresh">重新整理</button>
      <button class="btn ghost small" id="btn-logout">登出</button>
    </div>
  </header>

  <main>
    <!-- 統計 -->
    <section class="stats">
      <div class="stat">
        <span class="stat-label">在線節點</span>
        <span class="stat-value" id="stat-online">—</span>
        <span class="stat-hint" id="stat-online-hint">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">有效併發容量</span>
        <span class="stat-value" id="stat-capacity">—</span>
        <span class="stat-hint">min(節點上限) × 節點數</span>
      </div>
      <div class="stat">
        <span class="stat-label">主服務器</span>
        <span class="stat-value mono" id="stat-master">—</span>
        <span class="stat-hint" id="stat-jmeter">JMeter —</span>
      </div>
      <div class="stat">
        <span class="stat-label">最後更新</span>
        <span class="stat-value mono" id="stat-time">—</span>
        <span class="stat-hint">每 5 秒自動探測</span>
      </div>
    </section>

    <!-- 動作列 -->
    <section class="actionbar">
      <div class="actionbar-left">
        <button class="btn" id="btn-add-node">新增伺服器</button>
        <button class="btn primary" id="btn-deploy-all">
          <span class="bolt">⚡</span> 一鍵部署全部節點
        </button>
        <label class="check">
          <input type="checkbox" id="include-disabled">
          <span>含已停用節點</span>
        </label>
      </div>
      <p class="actionbar-hint" id="action-hint">
        透過 SSH 執行 <code>deploy/setup-node.sh</code>，可重複執行，已安裝的會跳過。
      </p>
    </section>

    <!-- 節點 -->
    <section class="section-head">
      <h2>伺服器節點</h2>
      <span class="muted" id="node-count"></span>
    </section>
    <section class="grid" id="node-grid"></section>

    <!-- Discord 機器人 -->
    <section class="panel bot-panel">
      <div class="panel-head">
        <h2>Discord 機器人</h2>
        <span class="chip" id="bot-chip">讀取中</span>
        <span class="spacer"></span>
        <button class="btn small" id="btn-bot-stop">停止</button>
        <button class="btn small" id="btn-bot-restart">重啟</button>
        <button class="btn small primary" id="btn-bot-start">啟動</button>
      </div>
      <div class="bot-body">
        <form id="bot-form" class="bot-form" autocomplete="off">
          <label class="field span2">
            <span>Bot Token</span>
            <input name="token" type="password" placeholder="貼上 Discord Bot Token" autocomplete="new-password">
          </label>
          <label class="field">
            <span>Owner ID（你）</span>
            <input name="owner_id" placeholder="右鍵頭像 → 複製使用者 ID">
          </label>
          <label class="field">
            <span>Guild ID（選填）</span>
            <input name="guild_id" placeholder="填入後斜線指令立即生效">
          </label>
          <label class="field span2">
            <span>Staff IDs（選填）</span>
            <input name="staff_ids" placeholder="逗號分隔，例如 123456789,987654321">
          </label>
          <div class="bot-actions span2">
            <button type="submit" class="btn primary small">儲存設定</button>
            <button type="button" class="btn small" id="btn-bot-test">測試 Token</button>
            <span class="form-status" id="bot-status-text"></span>
          </div>
        </form>
        <div class="bot-cmds">
          <div class="bot-cmds-title">斜線指令</div>
          <div id="bot-cmd-list" class="cmd-list"></div>
        </div>
      </div>
      <div class="bot-log-head">
        <span>即時日誌</span>
        <span class="spacer"></span>
        <button class="btn ghost small" id="btn-bot-clear-log">清空</button>
      </div>
      <pre class="bot-log" id="bot-log">尚無日誌</pre>
    </section>

    <!-- 部署輸出 -->
    <section class="panel">
      <div class="panel-head">
        <h2>部署輸出</h2>
        <span class="chip" id="job-chip">閒置</span>
        <span class="spacer"></span>
        <button class="btn ghost small hidden" id="btn-cancel">中止</button>
        <button class="btn ghost small" id="btn-clear-log">清空</button>
      </div>
      <div class="log" id="log">
        <div class="log-empty">尚無部署任務。按上方「一鍵部署全部節點」開始。</div>
      </div>
    </section>
  </main>
</div>

<!-- 檢查結果 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-title">節點檢查</h3>
      <button class="icon-btn" id="modal-close">×</button>
    </div>
    <pre id="modal-body">檢查中…</pre>
  </div>
</div>

<!-- 新增／編輯伺服器 -->
<div id="node-modal" class="modal hidden">
  <form class="modal-card form-card" id="node-form" autocomplete="off">
    <div class="modal-head">
      <h3 id="node-modal-title">新增伺服器</h3>
      <button type="button" class="icon-btn" id="node-modal-close">×</button>
    </div>
    <div class="form-body">
      <label class="field">
        <span>名稱</span>
        <input name="key" required maxlength="32" placeholder="hk-02">
      </label>
      <label class="field">
        <span>伺服器 IP</span>
        <input name="host" required placeholder="10.0.1.22">
      </label>
      <label class="field">
        <span>SSH 使用者</span>
        <input name="ssh_user" value="root" placeholder="root">
      </label>
      <label class="field">
        <span>SSH 密碼</span>
        <input name="ssh_password" type="password" placeholder="部署時使用" autocomplete="new-password">
      </label>
      <label class="field">
        <span>RMI 端口</span>
        <input name="port" type="number" min="1" max="65535" value="1099">
      </label>
      <label class="field">
        <span>SSH 端口</span>
        <input name="ssh_port" type="number" min="1" max="65535" value="22">
      </label>
      <label class="field">
        <span>地區</span>
        <input name="region" maxlength="16" placeholder="HK">
      </label>
      <label class="field">
        <span>執行緒上限</span>
        <input name="max_threads" type="number" min="1" max="10000" value="600">
      </label>
      <label class="field span2">
        <span>備註</span>
        <input name="note" maxlength="200" placeholder="4 vCPU / 8G">
      </label>
      <label class="check span2">
        <input type="checkbox" name="enabled" checked>
        <span>啟用此節點（停用後不參與壓測與批次部署）</span>
      </label>
      <div class="form-status span2" id="node-form-status"></div>
    </div>
    <div class="form-foot">
      <button type="button" class="btn ghost" id="btn-test-node">測試連接</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btn-node-cancel">取消</button>
      <button type="submit" class="btn" id="btn-node-save">僅儲存</button>
      <button type="button" class="btn primary" id="btn-node-save-deploy" disabled>開始部署節點</button>
    </div>
  </form>
</div>

<script src="/static/app.js"></script>
</body>
</html>
